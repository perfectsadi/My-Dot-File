$color = rgba(21, 21, 21, 1)
$inner_color = rgba(21, 21, 21, 0.66)
$outer_color = rgba(186, 179, 179, 1)
$font_color = rgba(237, 236, 236, 1)
$placeholder_color = rgba(237, 236, 236, 0.7)
$check_color = rgba(201, 195, 195, 1)


general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/hypr
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 4

    font_family = JetBrainsMono Nerd Font Mono
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
