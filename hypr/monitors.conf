env = GDK_SCALE,2
monitor=DP-1,1920x1080@240,0x0,1.0

# Explicitly target BOTH potential headless outputs so Hyprland catches them
monitor = HEADLESS-1, 1366x1024@60, 0x1080, 1
monitor = HEADLESS-2, 1366x1024@60, 0x1080, 1

# Automatically create the virtual display on boot cleanly without CLI arguments
exec-once = hyprctl output create headless

# Force workspace 6 to live on the virtual display
workspace = 6, monitor:HEADLESS-1, default:true
workspace = 6, monitor:HEADLESS-2, default:true
#hyprctl reload --- AUTOMATION RULES ---

# 1. Window rule: Force wl-mirror to ALWAYS open directly on Workspace 6
windowrule = match:class ^(wl-mirror)$, workspace 6 silent
windowrule = match:class ^(wl-mirror)$, fullscreen 1

# 2. Automatically launch the mirror tool in the background on startup
exec-once = wl-mirror Backend-1
exec-once = sleep 5 && systemctl --user restart sunshine