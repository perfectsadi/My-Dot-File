# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # No gaps between windows or borders
     gaps_in = 2
     gaps_out = 1
     border_size = 0

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
     #Use round window corners
     rounding = 14

     #Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
     dim_inactive = 0
     dim_strength = 0
     active_opacity = 1.9
     inactive_opacity = 1.9
     fullscreen_opacity = 2.0
    
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
   enabled = yes
   bezier = easeSoft, 0.18, 0.62, 0.32, 1.00
   bezier = easeFade, 0.28, 0.00, 0.22, 1.00
   animation = windows,          1, 2.6, easeSoft
   animation = windowsIn,        1, 2.4, easeSoft
   animation = windowsOut,       1, 2.2, easeFade
   animation = windowsMove,      1, 2.8, easeSoft
   animation = fade,             1, 2.2, easeFade
   animation = fadeIn,           1, 2.0, easeSoft
   animation = fadeOut,          1, 1.8, easeFade
   animation = fadeDim,          1, 1.8, easeFade
   animation = layers,           1, 2.2, easeSoft
   animation = layersIn,         1, 2.0, easeSoft
   animation = layersOut,        1, 1.8, easeFade
   animation = workspaces,       1, 2.4, easeSoft
   animation = specialWorkspace, 1, 2.2, easeSoft
   animation = border,           1, 2.8, easeSoft
   animation = borderangle,      1, 3.0, easeSoft
   animation = fadeSwitch,       1, 1.4, easeFade
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # See only one column per screen instead of two
    # column_width = 0.97
}
