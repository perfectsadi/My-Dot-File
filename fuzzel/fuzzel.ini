#main
font=JetBrains Mono Nerd Font:size=15
prompt="> "
icons-enabled=yes
icon-theme=Papirus-Dark
fields=name,generic,comment,categories,filename,keywords
show-actions=yes
lines=7
width=35
horizontal-pad=20
vertical-pad=12
inner-pad=8
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Jet black with a slight transparency (ee)
background=0d0d0dee
# Crisp, bright silver-white for primary text
text=e6e6e6ff
# Bright, metallic silver for matched characters
match=ccccccff
# Dark charcoal for the selected row
selection=262626ff
# Pure white for selected text to make it pop
selection-text=ffffffff
# Vibrant silver/white for matches inside the selection
selection-match=ffffffff
# Sleek silver border
border=a6a6a6ff
# Muted silver for the prompt symbol
prompt=8c8c8cff

[border]
width=2
radius=12